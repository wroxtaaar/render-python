services:
  - type: web
    name: seedflow-render
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SEEDR_API_TOKEN
        sync: false
      - key: SEEDR_LIBRARY_FOLDER_ID
        sync: false
      - key: SEEDR_MAX_SIZE_GB
        value: "5"
